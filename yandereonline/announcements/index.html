<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandere Online</title>
    <link rel="stylesheet" href="yostyle.css">
	<link rel="icon" type="image/png" href="/img/Icon.png">
    <style>
        .announcement-card {
            background: #fff;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
            border: 1px solid #ffe4e1;
        }
        .announcement-card h4 { color: #ff69b4; margin: 0 0 5px 0; }
        .announcement-card p { margin: 5px 0; font-size: 14px; }
        .meta-info { font-size: 12px; color: #888; display: flex; justify-content: space-between; margin-top: 10px; }
        .input-field { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 12px; border: 2px solid #ffb6c1; font-family: inherit; box-sizing: border-box; }
        textarea.input-field { height: 100px; resize: vertical; }
    </style>
</head>
<body>
    <div class="cute-container">
        <header class="cute-header">
            <h1 style="color: #ff69b4;">Announcement Manager</h1>
        </header>

        <main class="main-content">
            <!-- Create Announcement Panel -->
            <section class="cute-panel">
                <h2>New Announcement</h2>
                <input type="text" id="authorInput" class="input-field" placeholder="Author Name (e.g. Developer)">
                <textarea id="messageInput" class="input-field" placeholder="Write your announcement message here..."></textarea>
                <button class="btn" id="sendBtn" style="width: 100%;">Post Announcement</button>
                <p id="statusMsg" style="display:none; text-align:center; font-weight:bold; margin-top:10px;"></p>
            </section>

            <!-- List Announcements Panel -->
            <section class="cute-panel">
                <h2>Active Announcements</h2>
                <div id="announcementsContainer">Loading...</div>
            </section>
        </main>
    </div>

    <script>
        const WORKER_URL = "https://your-worker.your-subdomain.workers.dev"; // Replace with your Worker URL

        const authorInput = document.getElementById('authorInput');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusMsg = document.getElementById('statusMsg');
        const container = document.getElementById('announcementsContainer');

        async function fetchAnnouncements() {
            try {
                const res = await fetch(WORKER_URL);
                const data = await res.json();
                container.innerHTML = "";

                if (data.length === 0) {
                    container.innerHTML = "<p style='text-align:center; color:#888;'>No announcements found.</p>";
                    return;
                }

                data.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'announcement-card';
                    card.innerHTML = `
                        <h4>Author: ${item.author}</h4>
                        <p>${item.message}</p>
                        <div class="meta-info">
                            <span>👀 Views: <strong>${item.views || 0}</strong></span>
                            <span>📅 ${new Date(item.timestamp).toLocaleString()}</span>
                        </div>
                        <button class="btn btn-delete" style="font-size: 12px; padding: 6px 12px; width: 100%; margin-top: 10px;" onclick="deleteAnnouncement('${item.id}')">Delete</button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = "<p style='color:red;'>Failed to load announcements.</p>";
            }
        }

        sendBtn.addEventListener('click', async () => {
            const author = authorInput.value.trim();
            const message = messageInput.value.trim();

            if (!author || !message) {
                alert("Please fill in both author and message!");
                return;
            }

            sendBtn.disabled = true;
            statusMsg.style.display = "block";
            statusMsg.style.color = "#ff69b4";
            statusMsg.innerText = "Posting...";

            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ author, message })
                });

                if (res.ok) {
                    authorInput.value = "";
                    messageInput.value = "";
                    statusMsg.innerText = "Posted Successfully!";
                    fetchAnnouncements();
                } else {
                    throw new Error();
                }
            } catch (err) {
                statusMsg.style.color = "red";
                statusMsg.innerText = "Failed to post announcement.";
            } finally {
                sendBtn.disabled = false;
            }
        });

        async function deleteAnnouncement(id) {
            if (!confirm("Are you sure you want to delete this announcement?")) return;

            try {
                await fetch(`${WORKER_URL}?id=${id}`, { method: "DELETE" });
                fetchAnnouncements();
            } catch (err) {
                alert("Failed to delete.");
            }
        }

        fetchAnnouncements();
    </script>
</body>
</html>
