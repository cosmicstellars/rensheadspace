<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Broadcasting - Yandere Online</title>
    
    <link rel="stylesheet" href="yostyle.css"> 
    <link rel="icon" type="image/png" href="/img/Icon.png">
</head>
<body>

    <div class="cute-container">
        
        <header class="cute-header">
            <img src="/yandereonline/img/Logo.png" alt="Yandere Online Logo">
            <h1>TV Broadcasting</h1>
        </header>

        <nav class="cute-nav">
            <a href="/">Home</a>
            <a href="/creations">Creations & OCs</a>
            <a href="/projects">Games & Dev</a>
        </nav>

        <main style="display: flex; flex-direction: column; gap: 20px;">
            
            <section class="cute-panel">
                <h2>Upload Image for TV</h2>
                <div class="upload-area">
                    <p style="font-weight: 800; font-size: 16px;">Select an image to broadcast! (Max 2MB)</p>
                    <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp" style="margin-bottom: 15px;">
                    <br>
                    <button class="btn" id="uploadBtn" style="font-size: 16px; padding: 12px 25px;">Upload to Network</button>
                    <p id="statusMessage" style="display: none; margin-top: 15px; font-weight: 800;"></p>
                </div>
            </section>

            <section class="cute-panel">
                <h2>Your Uploaded Links</h2>
                <p style="text-align: center; font-weight: 600;">These links are saved locally! Copy the link and paste it into the TV in-game.</p>
                <div class="gallery-grid" id="galleryContainer">
                    </div>
            </section>

        </main>
    </div>

    <script>
        // --- CONFIGURATION ---
        const WORKER_URL = "https://tv-image-uploader.renmydearest.workers.dev";
        const MAX_FILE_SIZE = 2 * 1024 * 1024; // 2MB
        const MAX_WIDTH = 1280; // Resize to 720p equivalent width
        const MAX_HEIGHT = 720;

        const imageInput = document.getElementById('imageInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusMessage = document.getElementById('statusMessage');
        const galleryContainer = document.getElementById('galleryContainer');

        let uploadHistory = JSON.parse(localStorage.getItem('tvUploadHistory')) || [];
        renderGallery();

        uploadBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) {
                showStatus("Please select a file first!", "#ff4d4d");
                return;
            }

            if (file.size > MAX_FILE_SIZE) {
                const wantToResize = confirm(`This image is larger than 2MB (${(file.size / 1024 / 1024).toFixed(2)}MB). Would you like to automatically resize and optimize it before uploading?`);
                
                if (wantToResize) {
                    showStatus("Optimizing image...", "#ff69b4");
                    resizeAndUpload(file);
                } else {
                    showStatus("Upload cancelled. File too large.", "#ff4d4d");
                }
            } else {
                showStatus("Uploading...", "#ff69b4");
                uploadToServer(file);
            }
        });

        function resizeAndUpload(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height = Math.round(height *= MAX_WIDTH / width);
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width = Math.round(width *= MAX_HEIGHT / height);
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        const resizedFile = new File([blob], file.name.replace(/\.[^/.]+$/, ".jpg"), {
                            type: 'image/jpeg',
                            lastModified: Date.now()
                        });
                        uploadToServer(resizedFile);
                    }, 'image/jpeg', 0.85); 
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function uploadToServer(fileToUpload) {
            uploadBtn.disabled = true;
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    body: fileToUpload
                });

                if (!response.ok) throw new Error("Upload failed on server.");

                const data = await response.json();
                
                const newImage = {
                    url: data.url,
                    date: new Date().toLocaleDateString()
                };
                uploadHistory.push(newImage);
                localStorage.setItem('tvUploadHistory', JSON.stringify(uploadHistory));

                showStatus("Upload successful!", "#333");
                renderGallery();
                imageInput.value = ""; 

            } catch (error) {
                console.error(error);
                showStatus("Error uploading image. Check console for details.", "#ff4d4d");
            } finally {
                uploadBtn.disabled = false;
            }
        }

        function renderGallery() {
            galleryContainer.innerHTML = "";
            
            for (let i = uploadHistory.length - 1; i >= 0; i--) {
                const item = uploadHistory[i];
                
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.url}" alt="TV Upload">
                    <div class="date-text">${item.date}</div>
                    <button class="btn" style="font-size: 11px; padding: 6px 10px;" onclick="copyLink('${item.url}')">Copy Link</button>
                    <button class="btn btn-delete" style="font-size: 11px; padding: 6px 10px;" onclick="deleteHistory(${i})">Delete</button>
                `;
                galleryContainer.appendChild(div);
            }
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert("Link copied! Paste this into the TV in-game.");
            });
        }

        async function deleteHistory(index) {
            const sure = confirm("Are you sure you want to permanently delete this image from the cloud?");
            
            if (sure) {
                const item = uploadHistory[index];
                const fileName = item.url.split('/').pop();

                try {
                    showStatus("Deleting from cloud...", "#ff69b4");
                    
                    await fetch(`${WORKER_URL}?file=${fileName}`, {
                        method: "DELETE"
                    });
                    
                    showStatus("Image permanently deleted.", "#333");
                    setTimeout(() => { statusMessage.style.display = "none"; }, 3000);

                } catch (error) {
                    console.error("Failed to delete from cloud:", error);
                    alert("Warning: Failed to delete the image from the cloud server.");
                }

                uploadHistory.splice(index, 1);
                localStorage.setItem('tvUploadHistory', JSON.stringify(uploadHistory));
                renderGallery();
            }
        }

        function showStatus(text, color = "#ff69b4") {
            statusMessage.style.display = "block";
            statusMessage.style.color = color;
            statusMessage.innerText = text;
        }
    </script>
</body>
</html>
