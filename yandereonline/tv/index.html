<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Broadcasting - Yandere Online</title>
    
    <link rel="stylesheet" href="/yostyle.css?v=2"> 
    <link rel="icon" type="image/png" href="/img/Icon.png">
    <style>
        .mode-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 10px; border: 2px solid #ff69b4; background: white; color: #ff69b4; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .mode-btn.active { background: #ff69b4; color: white; }
        .hidden { display: none; }
        .error-link { color: #ff0000; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>

    <div class="cute-container">
        
        <header class="cute-header">
            <img src="/yandereonline/img/Logo.png" alt="Yandere Online Logo">
        </header>

        <main class="main-content">
            
            <section class="cute-panel">
                <h2>Create TV Channel</h2>
                
                <div class="mode-selector">
                    <button class="mode-btn active" id="btnStatic" onclick="setMode('static')">Image + Audio</button>
                    <button class="mode-btn" id="btnVideo" onclick="setMode('video')">Video Channel</button>
                </div>

                <div class="upload-area">
                    
                    <div id="thumbnailSection">
                        <p style="font-weight: 800; font-size: 16px; color: #ff69b4; margin-bottom: 5px;">
                            1. Channel Thumbnail Image <br>
                            <span style="font-size: 12px; color: #888;">(Required • Max 2MB)</span>
                        </p>
                        <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp" style="margin-bottom: 20px;">
                    </div>
                    
                    <div id="staticInputs">
                        <p style="font-weight: 800; font-size: 16px; color: #ff69b4; margin-bottom: 5px; border-top: 2px dashed #ffe4e1; padding-top: 15px;">2. Add Channel Audio <br><span style="font-size: 12px; color: #888;">(Optional • Max 5MB)</span></p>
                        <input type="file" id="audioInput" accept="audio/mpeg, audio/wav, audio/ogg" style="margin-bottom: 20px;">
                    </div>

                    <div id="videoInputs" class="hidden">
                        <p style="font-weight: 800; font-size: 16px; color: #ff69b4; margin-bottom: 5px;">
                            1. Add Video File <br>
                            <span style="font-size: 12px; color: #888;">(Required • Max 20MB • Auto-generates thumbnail)</span>
                        </p>
                        <input type="file" id="videoInput" accept="video/mp4" style="margin-bottom: 20px;">
                    </div>
                    
                    <button class="btn" id="uploadBtn" style="font-size: 16px; padding: 12px 25px; width: 100%;">Create Channel</button>
                    <p id="statusMessage" style="display: none; margin-top: 15px; font-weight: 800; text-align: center;"></p>
                </div>
            </section>

            <section class="cute-panel">
                <h2>Your TV Channels</h2>
                <p style="text-align: center; font-weight: 600; color: #666; margin-bottom: 20px;">
                    Copy the Channel Link and paste it into the TV in-game!
                </p>
                <div class="gallery-grid" id="galleryContainer"></div>
            </section>

        </main>
    </div>

    <script>
        const WORKER_URL = "https://tv-image-uploader.renmydearest.workers.dev";
        const MAX_IMAGE_SIZE = 2 * 1024 * 1024; // 2MB
        const MAX_AUDIO_SIZE = 5 * 1024 * 1024; // 5MB
        const MAX_VIDEO_SIZE = 20 * 1024 * 1024; // 20MB
        const MAX_WIDTH = 1280; 
        const MAX_HEIGHT = 720;

        let currentMode = 'static'; 
        
        const imageInput = document.getElementById('imageInput');
        const audioInput = document.getElementById('audioInput');
        const videoInput = document.getElementById('videoInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusMessage = document.getElementById('statusMessage');
        const galleryContainer = document.getElementById('galleryContainer');

        let uploadHistory = JSON.parse(localStorage.getItem('tvUploadHistory')) || [];
        
        window.setMode = function(mode) {
            currentMode = mode;
            if (mode === 'static') {
                document.getElementById('btnStatic').classList.add('active');
                document.getElementById('btnVideo').classList.remove('active');
                document.getElementById('thumbnailSection').classList.remove('hidden');
                document.getElementById('staticInputs').classList.remove('hidden');
                document.getElementById('videoInputs').classList.add('hidden');
                videoInput.value = ""; 
            } else {
                document.getElementById('btnVideo').classList.add('active');
                document.getElementById('btnStatic').classList.remove('active');
                document.getElementById('thumbnailSection').classList.add('hidden');
                document.getElementById('staticInputs').classList.add('hidden');
                document.getElementById('videoInputs').classList.remove('hidden');
                audioInput.value = ""; 
                imageInput.value = ""; 
            }
        };

        window.renderGallery = function() {
            galleryContainer.innerHTML = "";
            
            for (let i = uploadHistory.length - 1; i >= 0; i--) {
                const item = uploadHistory[i];
                const div = document.createElement('div');
                div.className = 'gallery-item';
                
                // THE FIX 1: If the worker didn't explicitly return imageUrl, piece it together manually
                let finalImageUrl = item.imageUrl || '';
if (!finalImageUrl && item.iName) {
    finalImageUrl = `${WORKER_URL}/${item.iName}`;
}

// NEW FIX: Add a unique timestamp so the browser never caches a broken image
finalImageUrl += (finalImageUrl.includes('?') ? '&' : '?') + 'v=' + new Date().getTime();
                
                let innerHtml = `
                    <img crossorigin="anonymous" src="${finalImageUrl}"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" 
                         alt="Preview" 
                         style="width:100%; aspect-ratio: 16/9; object-fit: cover; border-radius:8px; margin-bottom:5px; background-color: #ffe4e1;">
                    
                    <div style="display: none; width: 100%; aspect-ratio: 16/9; background-color: #ffe4e1; border-radius: 8px; margin-bottom: 5px; align-items: center; justify-content: center; color: #ff69b4; font-size: 14px; font-weight: bold;">
                        No Preview
                    </div>
                `;
                
                if (item.hasVideo) {
                    innerHtml += `<div style="font-size: 11px; color: #ff69b4; font-weight: bold; margin-bottom: 5px;">Video Channel</div>`;
                } else if (item.hasAudio) {
                    innerHtml += `<div style="font-size: 11px; color: #ff69b4; font-weight: bold; margin-bottom: 5px;">Static + Audio</div>`;
                } else {
                    innerHtml += `<div style="font-size: 11px; color: #888; font-weight: bold; margin-bottom: 5px;">Image Only</div>`;
                }

                innerHtml += `
                    <div class="date-text" style="font-size: 10px; color:#888;">${item.date}</div>
                    <button class="btn" style="font-size: 11px; padding: 6px 10px; width: 100%; margin-top:5px;" onclick="copyLink('${item.channelUrl}')">Copy Link</button>
                    <button class="btn btn-delete" style="font-size: 11px; padding: 6px 10px; width: 100%; margin-top:5px;" onclick="deleteHistory(${i})">Delete</button>
                `;
                
                div.innerHTML = innerHtml;
                galleryContainer.appendChild(div);
            }
        };

        window.copyLink = function(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert("Channel Link copied! Paste this into the TV in-game.");
            });
        };

        window.deleteHistory = async function(index) {
            if (confirm("Permanently delete this channel from the network?")) {
                const item = uploadHistory[index];
                
                try {
                    showStatus("Deleting from cloud...", "#ff69b4");
                    let deleteUrl = `${WORKER_URL}?c=${item.cName}&i=${item.iName}`;
                    if (item.aName) deleteUrl += `&a=${item.aName}`;
                    if (item.vName) deleteUrl += `&v=${item.vName}`; 

                    await fetch(deleteUrl, { method: "DELETE" });
                    showStatus("Deleted.", "#ff69b4");
                    setTimeout(() => { statusMessage.style.display = "none"; }, 2000);
                } catch (error) {
                    console.error("Failed to delete:", error);
                }

                uploadHistory.splice(index, 1);
                localStorage.setItem('tvUploadHistory', JSON.stringify(uploadHistory));
                window.renderGallery();
            }
        };

        // THE FIX 2: Bulletproof Video Thumbnail Generator
        function generateVideoThumbnail(videoFile) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(videoFile);
                video.muted = true; 
                video.playsInline = true;
                
                // loadeddata guarantees the first frame is actually ready to draw
                video.addEventListener('loadeddata', () => {
                    video.currentTime = Math.min(1, video.duration || 1); 
                });

                video.addEventListener('seeked', () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob((blob) => {
                        URL.revokeObjectURL(video.src);
                        if (blob) {
                            const thumbFile = new File([blob], "auto_thumb.jpg", { type: "image/jpeg" });
                            resolve(thumbFile);
                        } else {
                            reject("Failed to generate blob.");
                        }
                    }, 'image/jpeg', 0.85); 
                });

                video.addEventListener('error', (e) => {
                    URL.revokeObjectURL(video.src);
                    reject("Error generating thumbnail");
                });

                // Force the browser to start parsing the video file immediately
                video.load(); 
            });
        }

        function showStatus(text, color = "#ff69b4") {
            statusMessage.style.display = "block";
            statusMessage.style.color = color;
            statusMessage.innerText = text;
        }

        function resizeAndUpload(imgFile, audFile, vidFile) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height = Math.round(height *= MAX_WIDTH / width); width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width = Math.round(width *= MAX_HEIGHT / height); height = MAX_HEIGHT; }
                    }

                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        uploadToServer(blob, audFile, vidFile);
                    }, 'image/jpeg', 0.85); 
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(imgFile);
        }

        async function uploadToServer(imgData, audFile, vidFile) {
            uploadBtn.disabled = true;
            
            try {
                const formData = new FormData();
                
                const imgFilename = imgData.name || "image.jpg";
                formData.append("image", imgData, imgFilename);
                
                if (currentMode === 'static' && audFile) formData.append("audio", audFile, audFile.name);
                if (currentMode === 'video' && vidFile) formData.append("video", vidFile, vidFile.name);

                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) throw new Error("Upload failed on server.");

                const data = await response.json();
                
                const newChannel = {
                    channelUrl: data.channelUrl,     
                    imageUrl: data.imageUrl,         
                    hasAudio: audFile ? true : false, 
                    hasVideo: vidFile ? true : false,
                    cName: data.channelFileName,
                    iName: data.imageFileName,
                    aName: data.audioFileName,
                    vName: data.videoFileName,
                    date: new Date().toLocaleDateString()
                };
                
                uploadHistory.push(newChannel);
                localStorage.setItem('tvUploadHistory', JSON.stringify(uploadHistory));

                showStatus("Channel Broadcasted Successfully!", "#ff69b4");
                window.renderGallery();
                
                imageInput.value = ""; 
                audioInput.value = ""; 
                videoInput.value = "";

            } catch (error) {
                console.error(error);
                showStatus("Error uploading. Check console.", "#ff4d4d");
            } finally {
                uploadBtn.disabled = false;
            }
        }

        uploadBtn.addEventListener('click', async () => {
            const imgFile = imageInput.files[0];
            const audFile = audioInput.files[0];
            const vidFile = videoInput.files[0];

            if (currentMode === 'static') {
                if (!imgFile) return showStatus("You must select a thumbnail image for a static channel!", "#ff4d4d");
                if (audFile && audFile.size > MAX_AUDIO_SIZE) return showStatus("Audio file is too large! Max 5MB.", "#ff4d4d");

                if (imgFile.size > MAX_IMAGE_SIZE) {
                    if (confirm(`Image is larger than 2MB. Automatically resize?`)) {
                        showStatus("Optimizing image and uploading...", "#ff69b4");
                        resizeAndUpload(imgFile, audFile, null);
                    }
                } else {
                    showStatus("Uploading Channel to Network... Please wait.", "#ff69b4");
                    uploadToServer(imgFile, audFile, null);
                }
            } else if (currentMode === 'video') {
                if (!vidFile) return showStatus("You must select a video file!", "#ff4d4d");

                if (vidFile.size > MAX_VIDEO_SIZE) {
                    return showStatus("Video file is too large! Maximum allowed size is 20MB.", "#ff4d4d");
                }

                try {
                    showStatus("Snapping a quick thumbnail...", "#ff69b4");
                    const generatedThumb = await generateVideoThumbnail(vidFile);
                    showStatus("Uploading Channel to Network... Please wait.", "#ff69b4");
                    uploadToServer(generatedThumb, null, vidFile);
                } catch (err) {
                    console.error(err);
                    showStatus("Failed to generate thumbnail.", "#ff4d4d");
                }
            }
        });

        window.renderGallery();
    </script>
</body>
</html>
